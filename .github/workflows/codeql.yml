name: codeql

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'test/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: CodeQL Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore (BuildTasks then main library)
        run: |
          dotnet restore ./src/Soenneker.Quark.Gen.Tailwind.BuildTasks/Soenneker.Quark.Gen.Tailwind.BuildTasks.csproj --verbosity minimal
          dotnet restore ./src/Soenneker.Quark.Gen.Tailwind/Soenneker.Quark.Gen.Tailwind.csproj --verbosity minimal

      - name: Build BuildTasks
        run: dotnet build ./src/Soenneker.Quark.Gen.Tailwind.BuildTasks/Soenneker.Quark.Gen.Tailwind.BuildTasks.csproj --no-restore -c Release

      - name: Build main library
        run: dotnet build ./src/Soenneker.Quark.Gen.Tailwind/Soenneker.Quark.Gen.Tailwind.csproj --no-restore -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
